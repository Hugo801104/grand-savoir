# Maintenance mensuelle de la bibliothèque (sans IA, gratuite) :
#  - revérifie en ligne toutes les sources (pages disparues, faits qui ont changé) ;
#  - repère les questions dont la vérification date de plus d'un an ;
#  - ouvre ou met à jour un ticket « Maintenance du contenu » s'il y a quelque chose à revoir.

name: Maintenance du contenu

on:
  schedule:
    - cron: '9 4 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Vérifier sources et ancienneté
        run: npx tsx scripts/content/maintenance.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
