# Maintenance :
#  - sauvegarde chiffrée hebdomadaire de toute la base, relue et vérifiée aussitôt (conservée 90 jours) ;
#  - import initial / complémentaire des questions du dépôt (manuel ; n'écrase jamais une question existante) ;
#  - liste des questions dont la vérification date de plus d'un an.

name: Maintenance

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        type: choice
        options: [sauvegarde, import-questions, questions-a-reverifier]
        default: sauvegarde

permissions: {}

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ACTION: ${{ inputs.action || 'sauvegarde' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sauvegarde chiffrée et vérifiée
        if: env.ACTION == 'sauvegarde'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p backups
          npm run backup -- create "backups/grand-savoir-$(date -u +%Y%m%d).enc"
          npm run backup -- verify backups/*.enc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.ACTION == 'sauvegarde'
        with:
          name: sauvegarde-${{ github.run_id }}
          path: backups
          retention-days: 90
      - name: Importer les questions du dépôt
        if: env.ACTION == 'import-questions'
        run: |
          npm run content:validate
          npm run content:verify-sources
          npm run content -- import-seed
      - name: Questions à revérifier
        if: env.ACTION == 'questions-a-reverifier'
        run: npm run content -- stale 365
