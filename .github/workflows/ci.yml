# Contrôles qualité sur chaque Pull Request et chaque push.
# Actions épinglées sur une empreinte de commit ; droits minimaux ; scripts des paquets non exécutés.
name: Contrôles

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Failles connues dans les dépendances livrées
        run: npm audit --omit=dev --audit-level=high
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Contenus (structure, doublons, références)
        run: npm run content:validate
      - name: Construction
        run: npm run build
