# Quand une Pull Request de l'agent est validée (fusionnée) ou refusée (fermée) par un humain,
# le ticket de signalement lié est mis à jour : statut visible dans l'appli + message.

name: Agent — suivi des validations

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  suivi:
    if: startsWith(github.event.pull_request.head.ref, 'agent/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/agent/pr-closed.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_URL: ${{ github.event.pull_request.html_url }}
