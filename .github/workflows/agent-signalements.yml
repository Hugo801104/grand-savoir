# Traitement automatique des signalements (tickets étiquetés « signalement », créés depuis l'appli).
#
#  1. accueil     (sans IA)  : réglages et budget (agent.config.json + journal), auteur autorisé, fichier de tâche ;
#  2. analyse     (IA, sans aucun droit d'écriture) : l'agent vérifie, corrige, écrit sa décision ;
#  3. publication (sans IA, copie propre du dépôt) : contrôles déterministes, puis
#       - contenu : Pull Request, fusionnée automatiquement SEULEMENT si toutes les règles sont respectées ;
#       - code    : Pull Request, toujours relue et fusionnée par un humain ;
#     compte rendu sur le ticket, statut mis à jour (lu par l'appli), journal des coûts.
#
# Garde-fous : seuls les tickets du propriétaire déclenchent l'agent ; une exécution à la fois ; tentatives,
# exécutions quotidiennes et budget mensuel plafonnés ; nombre de tours de l'IA limité.
# Sans clé IA configurée, rien n'est dépensé : les signalements restent « nouveaux ».

name: Agent — signalements

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  accueil:
    if: >-
      github.event_name != 'issues' || (
        contains(github.event.issue.labels.*.name, 'signalement') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      issues: ${{ steps.intake.outputs.issues }}
      model: ${{ steps.intake.outputs.model }}
      max_turns: ${{ steps.intake.outputs.max_turns }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: intake
        run: npx tsx scripts/agent/intake.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AI_CONFIGURED: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.intake.outputs.issues != '[]'
        with:
          name: agent-taches
          path: .agent/tasks
          retention-days: 7
          include-hidden-files: true

  analyse:
    needs: accueil
    if: needs.accueil.outputs.issues != '' && needs.accueil.outputs.issues != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        issue: ${{ fromJSON(needs.accueil.outputs.issues) }}
    env:
      ISSUE: ${{ matrix.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-taches
          path: .agent/tasks
      - name: Agent IA
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          # Une seule des deux est nécessaire : clé API (facturation à l'usage) ou jeton d'abonnement Claude.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Traite le signalement (ticket n° ${{ matrix.issue }}) de l'application Le Grand Savoir.
            1. Lis d'abord et respecte strictement les consignes : .github/agent/instructions.md
            2. Fichier de tâche : .agent/tasks/${{ matrix.issue }}.json
            3. Écris ta décision dans : .agent/out/${{ matrix.issue }}/decision.json
          claude_args: >-
            --model ${{ needs.accueil.outputs.model }}
            --max-turns ${{ needs.accueil.outputs.max_turns }}
            --allowedTools "Read,Glob,Grep,Write,Edit,WebSearch,WebFetch,Bash(npm test),Bash(npm run typecheck),Bash(npm run content:validate),Bash(npx tsx scripts/content/wiki.ts:*),Bash(npx tsx scripts/agent/check-proposal.ts:*)"
      - name: Vérifier les éventuelles modifications de code (sans aucun secret)
        if: always()
        run: |
          mkdir -p ".agent/out/$ISSUE"
          git diff -- src tests > ".agent/out/$ISSUE/patch.diff" || true
          if [ -s ".agent/out/$ISSUE/patch.diff" ]; then
            if npm run typecheck > /tmp/t.txt 2>&1 && npm test >> /tmp/t.txt 2>&1; then
              { echo "OK — types et tests réussis"; tail -n 20 /tmp/t.txt; } > ".agent/out/$ISSUE/tests.txt"
            else
              { echo "ÉCHEC"; tail -n 60 /tmp/t.txt; } > ".agent/out/$ISSUE/tests.txt"
            fi
          fi
          EXEC="${{ steps.claude.outputs.execution_file }}"
          if [ -n "$EXEC" ] && [ -f "$EXEC" ]; then cp "$EXEC" ".agent/out/$ISSUE/execution.json"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-resultat-${{ matrix.issue }}
          path: .agent/out/${{ matrix.issue }}
          retention-days: 14
          include-hidden-files: true

  publication:
    needs: [accueil, analyse]
    if: always() && needs.accueil.outputs.issues != '' && needs.accueil.outputs.issues != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        issue: ${{ fromJSON(needs.accueil.outputs.issues) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-taches
          path: .agent/tasks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent-resultat-${{ matrix.issue }}
          path: .agent/out/${{ matrix.issue }}
      - name: Contrôler, publier ou proposer, rendre compte
        run: npx tsx scripts/agent/publish.ts "${{ matrix.issue }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANALYSE_RESULT: ${{ needs.analyse.result }}
