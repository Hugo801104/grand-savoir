# Enrichissement hebdomadaire et contrôlé de la bibliothèque — désactivé par défaut
# (agent.config.json → enrichment_enabled). Les nouvelles questions arrivent en Pull Request « validation requise »,
# sauf si enrichment_auto_publish est activé ET qu'elles passent tous les contrôles.

name: Agent — enrichissement

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'

permissions: {}

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      model: ${{ steps.plan.outputs.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: plan
        run: npx tsx scripts/agent/enrich.ts plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_CONFIGURED: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.run == 'true'
        with:
          name: enrichissement-tache
          path: .agent/tasks
          retention-days: 7
          include-hidden-files: true

  redaction:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: enrichissement-tache
          path: .agent/tasks
      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Rédige de nouvelles questions pour Le Grand Savoir.
            Consignes : .github/agent/enrichment.md (lis-les d'abord) ; format : .github/agent/instructions.md
            Tâche : .agent/tasks/enrich.json — sortie : .agent/out/enrich/decision.json
          claude_args: >-
            --model ${{ needs.plan.outputs.model }}
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Write,WebSearch,WebFetch,Bash(npx tsx scripts/content/wiki.ts:*),Bash(npx tsx scripts/agent/check-proposal.ts:*)"
      - name: Rassembler
        if: always()
        run: |
          mkdir -p .agent/out/enrich
          EXEC="${{ steps.claude.outputs.execution_file }}"
          if [ -n "$EXEC" ] && [ -f "$EXEC" ]; then cp "$EXEC" .agent/out/enrich/execution.json; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: enrichissement-resultat
          path: .agent/out/enrich
          retention-days: 14
          include-hidden-files: true

  publication:
    needs: [plan, redaction]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: enrichissement-resultat
          path: .agent/out/enrich
      - run: npx tsx scripts/agent/enrich.ts apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
